hero:
  headline:
    en: "Fault-tolerant Erlang/OTP systems for telecom, networking and IoT."
    vi: "Hệ thống Erlang/OTP chịu lỗi cho viễn thông, mạng và IoT."
  summary:
    en: "10+ years designing and running resilient backends for telecom signalling, network automation, messaging and IoT. I focus on supervision, observability and calm, predictable production."
    vi: "Hơn 10 năm thiết kế và vận hành backend bền vững cho tín hiệu viễn thông, tự động hóa mạng, messaging và IoT. Tôi chú trọng supervision, khả năng quan sát hệ thống và production ổn định, dễ dự đoán."
  terminal:
    - prompt: "1>"
      input: "dat:whoami()."
      output: "{senior_erlang_engineer, backend_architecture}"
    - prompt: "2>"
      input: "dat:domains()."
      output: "[telecom, network_automation, messaging, iot]"
    - prompt: "3>"
      input: "dat:principles()."
      output: "[let_it_crash, supervise, observe]"
    - prompt: "4>"
      input: "net_adm:ping('dat@cv')."
      output: "pong"

