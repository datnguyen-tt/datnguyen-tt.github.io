about:
  en:
    - "Principal Backend Architect and Erlang/OTP engineer with 10+ years building fault-tolerant distributed systems for IoT, telecom, network automation, and cloud-native environments."
    - "Designs resilient services, leads cross-functional delivery, and diagnoses complex concurrency and production issues. Brings hands-on depth across OTP architecture, telecom protocols, observability, data stores, and container-based infrastructure."
  vi:
    - "Kiến trúc sư Backend Cấp cao và kỹ sư Erlang/OTP với hơn 10 năm xây dựng hệ thống phân tán chịu lỗi cho IoT, viễn thông, tự động hóa mạng và môi trường cloud-native."
    - "Thiết kế dịch vụ chịu lỗi, dẫn dắt đội ngũ liên chức năng và xử lý các vấn đề phức tạp về concurrency trên production. Có kinh nghiệm thực chiến về kiến trúc OTP, giao thức viễn thông, observability, data store và hạ tầng container."

