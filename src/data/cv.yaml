about:
  en:
    - "I start from OTP supervision and let-it-crash discipline, then instrument services so production stays observable and predictable. I ship pragmatic increments, debug concurrency under load, and share OTP design and BEAM runtime lessons with teammates."
  vi:
    - "Tôi bắt đầu từ supervision và triết lý let-it-crash của OTP, rồi gắn instrumentation để production luôn quan sát được và dễ dự đoán. Tôi giao hàng theo từng bước thực tế, debug concurrency dưới tải và chia sẻ kinh nghiệm thiết kế OTP cùng runtime BEAM với đồng đội."

